##############################################
# Server Configuration
##############################################
server.port=${PORT:8086}

##############################################
# Application Configuration
##############################################
spring.application.name=${SPRING_APPLICATION_NAME:user-activity-service}

##############################################
# PostgreSQL
##############################################
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/useractivity_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

##############################################
# Keycloak
##############################################

##############################################
# Eureka
##############################################
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka-server:8761/eureka/}

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${HOSTNAME:user-activity-service}

##############################################
# Frontend
##############################################
frontend.url=${FRONTEND_URL:http://frontend:80}

##############################################
# Logging
##############################################
logging.pattern.console=%d{HH:mm:ss} %-5level ${spring.application.name} - %msg%n

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG