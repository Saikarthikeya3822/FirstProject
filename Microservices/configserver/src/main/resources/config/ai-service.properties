##############################################
# Server Configuration
##############################################
server.port=${SERVER_PORT:8087}

##############################################
# Application Configuration
##############################################
spring.application.name=${SPRING_APPLICATION_NAME:ai-service}

##############################################
# Keycloak Configuration
##############################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/Ecommerce-Users}

##############################################
# Eureka Configuration
##############################################
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${HOSTNAME:ai-service}

##############################################
# Spring AI - Gemini
##############################################
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
spring.ai.openai.chat.completions-path=${GEMINI_COMPLETIONS_PATH:/v1beta/openai/chat/completions}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}

##############################################
# Google Embeddings
##############################################
google.embedding.api-key=${GOOGLE_EMBEDDING_API_KEY}

##############################################
# Redis
##############################################
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

##############################################
# PostgreSQL
##############################################
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/ragdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

##############################################
# Frontend
##############################################
frontend.url=${FRONTEND_URL:http://frontend:80}

##############################################
# Logging
##############################################
logging.pattern.console=%d{HH:mm:ss} %-5level ${spring.application.name} - %msg%n
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG